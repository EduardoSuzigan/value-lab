[project]
name = "value-lab-backend"
version = "0.0.0"
description = "value-lab backend/batch — domínio, ETL, services, worker"
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
